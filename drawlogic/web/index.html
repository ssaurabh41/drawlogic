<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>drawlogic</title>
<!-- No web font. IBM Plex would otherwise be fetched from Google's CDN on
     every page load, which is one outbound request too many for a tool whose
     one other promise is that it needs no network at all. The font stacks
     below already name IBM Plex first for the machines that have it
     installed locally, then fall back to the system sans/mono. -->
<link rel="stylesheet" href="/css/app.css">
</head>
<body>

<div class="menubar">
  <div class="brand">draw<span>logic</span></div>

  <label class="field">
    <span>File</span>
    <select id="file-select" title="Drawings found under the served folder"></select>
  </label>

  <button id="btn-new" class="action" title="New drawing (Ctrl+N)">New</button>
  <button id="btn-save" class="action" title="Save (Ctrl+S)">Save</button>
  <button id="btn-export" class="action" title="Export SVG (Ctrl+E)">Export SVG</button>
  <button id="btn-symbol" class="action"
          title="Turn this drawing into a symbol: its shapes become the artwork, its ports become the pins">Save as symbol</button>
  <button id="btn-png" class="action"
          title="Copy the drawing as a picture, ready to paste into a slide (Ctrl+Shift+E)">Copy PNG</button>

  <span class="divider"></span>
  <button id="btn-theme" class="action" title="Appearance: follow the system, light, or dark">Theme: auto</button>
  <span class="divider"></span>
  <button id="btn-undo" class="action" title="Undo (Ctrl+Z)">Undo</button>
  <button id="btn-redo" class="action" title="Redo (Ctrl+Shift+Z)">Redo</button>

  <div class="spacer"></div>
  <div class="filechip">
    <span id="file-path">no file</span>
    <nav id="breadcrumb" class="crumbs" title="Where you drilled in from" hidden></nav>
    <span id="dirty" class="dirty" hidden title="unsaved changes">&#9679;</span>
  </div>
</div>

<svg class="sprite" aria-hidden="true" focusable="false">
  <defs>
    <g id="i-rotate"><path d="M13 6a5 5 0 1 0 1.2 3.4"/><path d="M13 2.5V6h-3.5"/></g>
    <g id="i-flip"><path d="M8 2v12"/><path d="M6 5 2.5 8 6 11z"/><path d="M10 5l3.5 3-3.5 3z"/></g>
    <g id="i-group"><rect x="2.5" y="2.5" width="6" height="6"/><rect x="7.5" y="7.5" width="6" height="6"/></g>
    <g id="i-ungroup"><rect x="2.5" y="2.5" width="5" height="5"/><rect x="8.5" y="8.5" width="5" height="5"/><path d="M8.5 5.5h1M5.5 8.5v1"/></g>
    <g id="i-delete"><path d="M3.5 4.5h9"/><path d="M5.5 4.5V3h5v1.5"/><path d="M4.5 4.5 5 13.5h6l.5-9"/></g>
    <g id="i-layout"><rect x="1.5" y="3.5" width="4" height="4"/><rect x="10.5" y="8.5" width="4" height="4"/><path d="M5.5 5.5h3v5h2"/></g>
    <g id="i-tidy"><path d="M2 4.5h12"/><path d="M2 11.5h12"/><path d="M6 4.5v7"/><path d="M10 4.5v7"/></g>
    <g id="i-align-left"><path d="M2.5 2v12"/><rect x="4.5" y="3.5" width="9" height="3"/><rect x="4.5" y="9.5" width="5.5" height="3"/></g>
    <g id="i-align-hcenter"><path d="M8 2v12"/><rect x="3.5" y="3.5" width="9" height="3"/><rect x="5.25" y="9.5" width="5.5" height="3"/></g>
    <g id="i-align-right"><path d="M13.5 2v12"/><rect x="2.5" y="3.5" width="9" height="3"/><rect x="6" y="9.5" width="5.5" height="3"/></g>
    <g id="i-align-top"><path d="M2 2.5h12"/><rect x="3.5" y="4.5" width="3" height="9"/><rect x="9.5" y="4.5" width="3" height="5.5"/></g>
    <g id="i-align-vcenter"><path d="M2 8h12"/><rect x="3.5" y="3.5" width="3" height="9"/><rect x="9.5" y="5.25" width="3" height="5.5"/></g>
    <g id="i-align-bottom"><path d="M2 13.5h12"/><rect x="3.5" y="2.5" width="3" height="9"/><rect x="9.5" y="6" width="3" height="5.5"/></g>
    <g id="i-dist-h"><path d="M2 2.5v11"/><path d="M14 2.5v11"/><rect x="6.5" y="5.5" width="3" height="5"/></g>
    <g id="i-dist-v"><path d="M2.5 2h11"/><path d="M2.5 14h11"/><rect x="5.5" y="6.5" width="5" height="3"/></g>
    <g id="i-front"><rect x="2.5" y="2.5" width="8" height="8"/><path d="M5.5 13.5h8v-8"/></g>
    <g id="i-back"><rect x="5.5" y="5.5" width="8" height="8"/><path d="M10.5 2.5h-8v8"/></g>
  </defs>
</svg>

<div class="toolbar">
  <div class="tgroup">
    <button class="tool" data-tool="select" aria-pressed="true" title="Select (V)">Select</button>
    <button class="tool" data-tool="wire" aria-pressed="false" title="Wire (W)">Wire</button>
  </div>

  <div class="tgroup">
    <button class="tool" data-tool="shape" data-shape="line" title="Line (L)">Line</button>
    <button class="tool" data-tool="shape" data-shape="rect" title="Box (B)">Box</button>
    <button class="tool" data-tool="shape" data-shape="polygon" title="Polygon (P) - click points, double-click to close">Polygon</button>
    <button class="tool" data-tool="shape" data-shape="text" title="Text (T)">Text</button>
  </div>

  <div class="tgroup">
    <button class="tool icon" data-command="rotate-cw" title="Rotate 90 clockwise (Ctrl+R)" aria-label="Rotate 90 clockwise"><svg class="ico" viewBox="0 0 16 16" aria-hidden="true"><use href="#i-rotate"/></svg></button>
    <button class="tool icon" data-command="flip-h" title="Flip horizontal (Ctrl+H)" aria-label="Flip horizontal"><svg class="ico" viewBox="0 0 16 16" aria-hidden="true"><use href="#i-flip"/></svg></button>
    <button class="tool icon" data-command="group" title="Group (Ctrl+G)" aria-label="Group"><svg class="ico" viewBox="0 0 16 16" aria-hidden="true"><use href="#i-group"/></svg></button>
    <button class="tool icon" data-command="ungroup" title="Ungroup (Ctrl+Shift+G)" aria-label="Ungroup"><svg class="ico" viewBox="0 0 16 16" aria-hidden="true"><use href="#i-ungroup"/></svg></button>
    <button class="tool icon" data-command="delete" title="Delete (Del)" aria-label="Delete"><svg class="ico" viewBox="0 0 16 16" aria-hidden="true"><use href="#i-delete"/></svg></button>
  </div>

  <div class="tgroup">
    <button class="tool icon" data-command="layout" title="Auto layout - rearrange everything from what it is wired to" aria-label="Auto layout"><svg class="ico" viewBox="0 0 16 16" aria-hidden="true"><use href="#i-layout"/></svg></button>
    <button class="tool icon" data-command="tidy" title="Tidy up - straighten wires" aria-label="Tidy up"><svg class="ico" viewBox="0 0 16 16" aria-hidden="true"><use href="#i-tidy"/></svg></button>
  </div>

  <div class="tgroup">
    <button class="tool icon" data-command="align-left" title="Align left" aria-label="Align left"><svg class="ico" viewBox="0 0 16 16" aria-hidden="true"><use href="#i-align-left"/></svg></button>
    <button class="tool icon" data-command="align-hcenter" title="Align centre" aria-label="Align centre"><svg class="ico" viewBox="0 0 16 16" aria-hidden="true"><use href="#i-align-hcenter"/></svg></button>
    <button class="tool icon" data-command="align-right" title="Align right" aria-label="Align right"><svg class="ico" viewBox="0 0 16 16" aria-hidden="true"><use href="#i-align-right"/></svg></button>
    <button class="tool icon" data-command="align-top" title="Align top" aria-label="Align top"><svg class="ico" viewBox="0 0 16 16" aria-hidden="true"><use href="#i-align-top"/></svg></button>
    <button class="tool icon" data-command="align-vcenter" title="Align middle" aria-label="Align middle"><svg class="ico" viewBox="0 0 16 16" aria-hidden="true"><use href="#i-align-vcenter"/></svg></button>
    <button class="tool icon" data-command="align-bottom" title="Align bottom" aria-label="Align bottom"><svg class="ico" viewBox="0 0 16 16" aria-hidden="true"><use href="#i-align-bottom"/></svg></button>
  </div>

  <div class="tgroup">
    <button class="tool icon" data-command="distribute-h" title="Distribute across" aria-label="Distribute across"><svg class="ico" viewBox="0 0 16 16" aria-hidden="true"><use href="#i-dist-h"/></svg></button>
    <button class="tool icon" data-command="distribute-v" title="Distribute down" aria-label="Distribute down"><svg class="ico" viewBox="0 0 16 16" aria-hidden="true"><use href="#i-dist-v"/></svg></button>
    <button class="tool icon" data-command="front" title="Bring to front (Ctrl+])" aria-label="Bring to front"><svg class="ico" viewBox="0 0 16 16" aria-hidden="true"><use href="#i-front"/></svg></button>
    <button class="tool icon" data-command="back" title="Send to back (Ctrl+[)" aria-label="Send to back"><svg class="ico" viewBox="0 0 16 16" aria-hidden="true"><use href="#i-back"/></svg></button>
  </div>

  <label class="field">
    <span>Grid</span>
    <select id="grid-select">
      <option value="dots">Dots</option>
      <option value="dots-wide">Dots &mdash; wide</option>
      <option value="lines">Lines</option>
      <option value="lines-heavy">Lines &mdash; major/minor</option>
      <option value="blank">Blank</option>
    </select>
  </label>

  <label class="field slider">
    <span>Zoom</span>
    <input id="zoom-slider" type="range" min="10" max="400" step="1" value="100">
    <output id="zoom-value">100%</output>
  </label>
  <button id="btn-fit" class="action" title="Fit to window (Ctrl+0)">Fit</button>

  <label class="field slider">
    <span>Text</span>
    <input id="font-slider" type="range" min="50" max="250" step="5" value="100">
    <output id="font-value">100%</output>
  </label>

  <label class="field slider">
    <span>Symbols</span>
    <input id="symbol-slider" type="range" min="50" max="250" step="5" value="100">
    <output id="symbol-value">100%</output>
  </label>
</div>

<div class="panes">
  <aside class="palette">
    <div class="pane-head">Symbols</div>
    <div id="palette-body"></div>
    <p class="palette-note">
      Click a symbol, then click the canvas. Shift-click the canvas to keep
      placing the same one.
    </p>
  </aside>

  <main class="stage">
    <svg id="canvas" xmlns="http://www.w3.org/2000/svg"></svg>
  </main>

  <aside class="inspector">
    <div class="pane-head">Properties</div>
    <div id="properties-body"></div>
  </aside>
</div>

<div class="status">
  <span id="status-counts">&mdash;</span>
  <span id="status-cursor">x &mdash; y &mdash;</span>
  <span class="push" id="status-message">Shift-drag or hold Space to pan &middot; scroll to zoom</span>
</div>

<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

<script type="module" src="/js/main.js"></script>
</body>
</html>
